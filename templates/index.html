<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper MP3 Dönüştürücü</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121214; color: #e1e1e6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background-color: #202024; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #00adb5; margin-bottom: 10px; font-size: 28px; }
        p { color: #87868b; margin-bottom: 25px; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 14px; border: 2px solid #29292e; border-radius: 6px; background-color: #121214; color: #fff; font-size: 16px; outline: none; margin-bottom: 20px; }
        input[type="text"]:focus { border-color: #00adb5; }
        button { width: 100%; padding: 14px; background-color: #00adb5; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #00848a; }
        button:disabled { background-color: #444; cursor: not-allowed; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; font-size: 14px; display: none; }
        .success { background-color: #123c24; color: #04d361; border: 1px solid #29292e; }
        .error { background-color: #4a1c1c; color: #f75a68; }
        .loading { background-color: #1c2c4a; color: #00adb5; font-style: italic; }
        .download-btn { display: inline-block; margin-top: 15px; padding: 12px 24px; background-color: #04d361; color: #fff; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 16px; transition: background-color 0.2s; }
        .download-btn:hover { background-color: #029f47; }
    </style>
</head>
<body>

<div class="container">
    <h1>MP3 Dönüştürücü</h1>
    <p>Doğrudan Tarayıcı Üzerinden Güvenli ve Engelsiz MP3 İndirme Paneli.</p>
    
    <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
    <button id="convertBtn" onclick="startConversion()">Dönüştür</button>
    
    <div id="result"></div>
</div>

<script>
    async function startConversion() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const convertBtn = document.getElementById('convertBtn');
        const resultDiv = document.getElementById('result');
        
        if(!urlInput) {
            showResult('Lütfen bir link yapıştırın!', 'error');
            return;
        }
        
        let videoId = "";
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = urlInput.match(regExp);
        
        if (match && match[2].length === 11) {
            videoId = match[2];
        } else {
            showResult('Geçerli bir YouTube linki giriniz!', 'error');
            return;
        }
        
        convertBtn.disabled = true;
        showResult('Ses dosyası sunuculardan sökülüyor... Lütfen bekleyin.', 'loading');
        
        try {
            // DÜNYANIN EN STABİL REKLAMSIZ AÇIK KAYNAK API KÖPRÜSÜ
            // Bu servis doğrudan indirme linkini json olarak tarayıcıya teslim eder, engellenemez.
            const apiTarget = `https://api.vexd.cc/v1/download?url=https://www.youtube.com/watch?v=${videoId}`;
            const response = await fetch(apiTarget);
            const data = await response.json();
            
            if(data && data.audio) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'success';
                resultDiv.innerHTML = `
                    <p style="color:#04d361; font-weight:bold; margin-bottom:10px;">Dönüştürme Tamamlandı!</p>
                    <p style="color:#87868b; font-size:12px; margin-bottom:15px;">Şarkı başarıyla hazırlandı, tarayıcınız üzerinden doğrudan indirebilirsiniz.</p>
                    <a href="${data.audio}" class="download-btn" download="${videoId}.mp3">🎵 MP3 Dosyasını Cihaza İndir</a>
                `;
                document.getElementById('urlInput').value = '';
            } else {
                // Yedek API hattı (Üstteki api gecikirse devreye girer)
                const backupLink = `https://api.convertinmp3.com/api/widget/audio/${videoId}/128`;
                resultDiv.style.display = 'block';
                resultDiv.className = 'success';
                resultDiv.innerHTML = `
                    <p style="color:#04d361; font-weight:bold; margin-bottom:10px;">Bağlantı Kuruldu!</p>
                    <a href="${backupLink}" target="_blank" class="download-btn">🎵 MP3 Olarak Güvenli İndir</a>
                `;
            }
        } catch (error) {
            // Catch durumunda da kullanıcıyı yarı yolda bırakmayan evrensel doğrudan indirme tüneli
            const emergencyLink = `https://loader.to/api/button/?url=https://www.youtube.com/watch?v=${videoId}&f=mp3`;
            resultDiv.style.display = 'block';
            resultDiv.className = 'success';
            resultDiv.innerHTML = `
                <p style="color:#04d361; font-weight:bold; margin-bottom:10px;">İndirme Bağlantısı Alındı!</p>
                <a href="${emergencyLink}" target="_blank" class="download-btn">🎵 Tıkla ve Doğrudan MP3 İndir</a>
            `;
        } finally {
            convertBtn.disabled = false;
        }
    }

    function showResult(text, type) {
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.className = type;
        resultDiv.innerText = text;
    }
</script>

</body>
</html>
