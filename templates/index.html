<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper MP3 Dönüştürücü</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #121214; color: #e1e1e6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background-color: #202024; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #00adb5; margin-bottom: 10px; font-size: 28px; }
        p { color: #87868b; margin-bottom: 25px; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 14px; border: 2px solid #29292e; border-radius: 6px; background-color: #121214; color: #fff; font-size: 16px; outline: none; margin-bottom: 20px; }
        input[type="text"]:focus { border-color: #00adb5; }
        button { width: 100%; padding: 14px; background-color: #00adb5; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #00848a; }
        button:disabled { background-color: #444; cursor: not-allowed; }
        #result { margin-top: 20px; padding: 15px; border-radius: 6px; font-size: 14px; display: none; }
        .success { background-color: #123c24; color: #04d361; }
        .error { background-color: #4a1c1c; color: #f75a68; }
        .loading { color: #00adb5; font-style: italic; }
        .download-btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background-color: #04d361; color: #fff; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .download-btn:hover { background-color: #029f47; }
    </style>
</head>
<body>

<div class="container">
    <h1>MP3 Dönüştürücü</h1>
    <p>Tarayıcı Tabanlı, Hızlı ve Güvenli Dönüştürme.</p>
    
    <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=...">
    <button id="convertBtn" onclick="startConversion()">Dönüştür</button>
    
    <div id="result"></div>
</div>

<script>
    function startConversion() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const resultDiv = document.getElementById('result');
        
        if(!urlInput) {
            showResult('Lütfen bir link yapıştırın!', 'error');
            return;
        }
        
        // İşlem başladı bildirimi veriyoruz
        showResult('Bağlantı başarıyla hazırlandı! Aşağıdaki butona tıklayarak indirme sayfasına gidebilirsiniz.', 'success');
        
        // TARAYICI TABANLI KESİN ÇÖZÜM KÖPRÜSÜ
        // Kullanıcıyı Render sunucusuna sokmadan doğrudan indirme sayfasına yönlendiren güvenli global havuz
        const cleanUrl = encodeURIComponent(urlInput);
        const downloadLink = `https://9xbuddy.xyz/process?url=${cleanUrl}`;
        
        // Butonu ve mesajı ekrana basıyoruz
        resultDiv.innerHTML = `
            <p style="color:#04d361; margin-bottom:10px;">Bağlantı başarıyla oluşturuldu!</p>
            <a href="${downloadLink}" target="_blank" class="download-btn">🎵 MP3 Sayfasına Git ve İndir</a>
        `;
        
        // Input alanını temizle
        document.getElementById('urlInput').value = '';
    }

    function showResult(text, type) {
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.className = type;
        resultDiv.innerText = text;
    }
</script>

</body>
</html>
